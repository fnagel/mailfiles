<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">

<div class="form-group mb-3 row">
	<label for="subject" class="col-sm-2 col-form-label">
		<f:translate key="tx_mailfiles_domain_model_mail.subject" />
	</label>
	<div class="col-sm-10">
		<f:form.textfield id="subject" property="subject" class="form-control" />
	</div>
</div>

<f:if condition="{settings.showMailToField}">
	<div class="form-group mb-3 row">
		<label for="email" class="col-sm-2 col-form-label">
			<f:translate key="tx_mailfiles_domain_model_mail.email" />
		</label>
		<div class="col-sm-10">
			<f:form.textfield id="email" property="email" type="email" required="true" class="form-control" />
		</div>
	</div>
</f:if>

<div class="form-group mb-3 row">
	<label for="message" class="col-sm-2 col-form-label">
		<f:translate key="tx_mailfiles_domain_model_mail.message" />
	</label>
	<div class="col-sm-10">
		<f:form.textarea id="message" property="message" rows="10" class="form-control" />
	</div>
</div>

<div class="form-group mb-3 row">
	<div class="offset-sm-2 col-sm-10">
		<div class="form-check">
			<input type="checkbox" id="auto" name="auto" value="1" class="form-check-input">
			<label for="auto" class="form-check-label">
				<f:translate key="tx_mailfiles_domain_model_mail.auto" />
			</label>
		</div>
	</div>
</div>

</html>
